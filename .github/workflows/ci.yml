name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: newsagent, POSTGRES_PASSWORD: newsagent, POSTGRES_DB: newsagent }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newsagent" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Migrations apply to Postgres and match the models
        run: uv run alembic upgrade head && uv run alembic check
        env: { DATABASE_URL: "postgresql+asyncpg://newsagent:newsagent@localhost:5432/newsagent" }
      - name: Backup and restore a seeded database (the restore test must pass)
        run: |
          uv run alembic upgrade head
          uv run python ../scripts/seed_demo.py 5
          mkdir -p /tmp/backups
          uv run python ../scripts/backup.py --out /tmp/backups
          uv run python ../scripts/restore_test.py /tmp/backups/$(ls /tmp/backups | grep 'dump$' | head -1)
        env: { DATABASE_URL: "postgresql+asyncpg://newsagent:newsagent@localhost:5432/newsagent" }
      - name: Dependency audit
        run: uv export --no-hashes --no-dev --frozen -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - name: Same suite on Postgres
        run: uv run pytest -q
        env: { TEST_DATABASE_URL: "postgresql+asyncpg://newsagent:newsagent@localhost:5432/newsagent" }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: astral-sh/setup-uv@v3
      - run: (cd ../backend && uv sync) && (cd ../backend && uv run python ../scripts/export_openapi.py)
      - run: pnpm install --frozen-lockfile
      - name: Generated API client must be up to date
        run: pnpm gen:api && git diff --exit-code openapi.json src/api/schema.d.ts
      - run: pnpm lint && pnpm build && pnpm test
      - run: pnpm audit --prod
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v3
      - run: (cd ../api && uv sync)
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
  e2e-real:
    # slow (about 6 min): real ffmpeg + Remotion + browser recording. Runs on main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [api, web, renderer]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: (cd ../api && uv sync)
      - run: pnpm install --frozen-lockfile && (cd ../backend/renderer && pnpm install --frozen-lockfile)
      - run: pnpm exec playwright install --with-deps chromium
      - run: E2E_QUESTIONS=5 pnpm e2e:real
  renderer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/renderer } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test
      - run: pnpm audit --prod
